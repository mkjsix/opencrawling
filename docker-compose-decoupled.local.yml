# Local development override for docker-compose-decoupled.yml
# Enables fast builds by leveraging BuildKit Maven cache mounts (~/.m2).
#
# Usage:
#   docker compose -f docker-compose-decoupled.yml -f docker-compose-decoupled.local.yml build
#   docker compose -f docker-compose-decoupled.yml -f docker-compose-decoupled.local.yml up -d

services:
  oc-crawler:
    build:
      context: .
      dockerfile: docker/local/Dockerfile.crawler

  oc-ingestion-consumer:
    build:
      context: .
      dockerfile: docker/local/Dockerfile.ingestion-consumer

  oc-embedding-consumer:
    build:
      context: .
      dockerfile: docker/local/Dockerfile.embedding-consumer

  oc-writer-consumer:
    build:
      context: .
      dockerfile: docker/local/Dockerfile.writer-consumer

  oc-mcp-server:
    build:
      context: .
      dockerfile: docker/local/Dockerfile.mcp-server

  # Containerized Maven builder mounting host ~/.m2 repository
  # Run on-demand via: docker compose -f docker-compose-decoupled.local.yml run --rm oc-maven-builder
  oc-maven-builder:
    image: maven:3-eclipse-temurin-25
    container_name: oc-maven-builder
    working_dir: /app
    volumes:
      - ${HOME}/.m2:/root/.m2
      - .:/app
    command: mvn clean package -DskipTests
    profiles: ["build"]
